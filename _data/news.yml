- date: "2026-10-15"
  title: "Sense, Think, Transmit: TinyML and LoRaWAN for environmental scientists"
  source: "LinkedIn"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7516588796721905664/
  image: /assets/img/news/imperial-tinyml-lorawan-2026.jpg
  image_alt: "Group photo of the workshop participants holding their Arduino Nicla Vision boards outside the Ingrebourne Valley Visitor Centre"
  text: >-
    A four-day hands-on workshop on TinyML and LoRaWAN, organised by Imperial College London in the
    framework of a project with the UK Centre for Ecology &amp; Hydrology (UKCEH). The participants were
    environmental scientists: they trained models to recognise sounds and detect objects on
    microcontrollers, sent the results over LoRaWAN, and started developing applications of their own,
    a mix with great potential for scientific fieldwork. Hosted at the Ingrebourne Valley Visitor
    Centre, Hornchurch Country Park. Slides and code are on the
    <a href="https://marcozennaro.github.io/imperial-2026/">workshop page</a>.

- date: "2025-02-20"
  title: "What's tinyML? The Global South's alternative to power-hungry, pricey AI"
  source: "Science"
  url: https://www.science.org/content/article/what-s-tinyml-global-south-s-alternative-power-hungry-pricey-ai
  image: /assets/img/news/science-tinyml.jpg
  image_alt: "Opening page of the Science feature 'Cutting AI down to size', 21 February 2025"
  image_shape: portrait
  text: >-
    A Science feature on low-power, low-cost machine learning in regions where electricity and
    connectivity cannot be assumed, covering the TinyML teaching network across the Global South
    and our work on classifying mosquito species with TinyML.

- date: "2024-02-08"
  title: "AI in the developing world: how 'tiny machine learning' can have a big impact"
  source: "The Conversation"
  url: https://theconversation.com/ai-in-the-developing-world-how-tiny-machine-learning-can-have-a-big-impact-220025
  image: /assets/img/news/conversation-tinyml-page.jpg
  image_alt: "The Conversation article page, with a photo of a tortoise carrying a TinyML sensor in Argentina"
  image_shape: portrait
  text: >-
    An article I co-wrote with Brian Plancher, Matthew Stewart and Vijay Janapa Reddi on how
    microcontrollers costing as little as a dollar can bring machine learning to the developing
    world, and on the TinyML4D network of academic institutions across the Global South.
