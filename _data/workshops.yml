# Workshops I organized — newest first.
#
# To add one, copy a block and edit it. Fields:
#   title:     name of the workshop (required)
#   year:      e.g. 2025 (required)
#   place:     city / country / "Virtual"
#   area:      tinyml | weather | dtn | iot | ai | outreach   (drives the colored tag)
#   end:       last day, "YYYY-MM-DD" in quotes (optional; shows an "Upcoming" badge until then)
#   url:       workshop website (optional)
#   material:  link to code / GitHub repo (optional)
#   slides:    list of slide decks (optional). Each item has a label and a link.
#              Put PDFs in the /slides folder and link them as slides/<file>.pdf,
#              or link to an external URL.
#
# Example:
# - title: "Workshop on Low-cost Weather Stations"
#   year: 2026
#   place: "Trieste, Italy"
#   area: weather
#   url: https://indico.ictp.it/event/XXXX
#   slides:
#     - label: "Opening"
#       link: slides/2026-weather-opening.pdf

